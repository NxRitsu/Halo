name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported macOS and its SDK.
          - runner: macos-26
            preview: false
          # macOS 27 SDK. GitHub still labels this image as a preview, so it doesn't fail the run.
          - runner: xcode-27
            preview: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
