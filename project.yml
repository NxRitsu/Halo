# XcodeGen specification. Generate the project with `xcodegen generate`.
# The app name is defined here only (APP_NAME) and read at runtime through `AppInfo.name`.

name: Halo

options:
  bundleIdPrefix: io.github.nxritsu
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    APP_NAME: Halo
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Halo:
    type: application
    platform: macOS
    sources:
      - path: Halo
    dependencies:
      # Loaded by /usr/bin/perl at runtime, not linked by the app.
      - target: MediaRemoteHelper
        embed: true
        link: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nxritsu.Halo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Halo/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Halo/Resources/Halo.entitlements
      properties:
        # Only used by the Music and Spotify fallback, when MediaRemote is unavailable.
        com.apple.security.automation.apple-events: true
    info:
      path: Halo/Resources/Info.plist
      properties:
        CFBundleName: $(APP_NAME)
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
        NSAppleEventsUsageDescription: "Halo controls playback in Music and Spotify when the system's now playing information is unavailable."
        NSAccessibilityUsageDescription: "Halo reads the position of menu bar items to avoid covering them. This is only used if you choose to show playback when there's room."

  MediaRemoteHelper:
    type: framework
    platform: macOS
    sources:
      - path: MediaRemoteHelper
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nxritsu.Halo.MediaRemoteHelper
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
        ENABLE_MODULE_VERIFIER: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: YES

schemes:
  Halo:
    build:
      targets:
        Halo: all
    run:
      config: Debug
    archive:
      config: Release
