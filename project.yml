# XcodeGen specification. Generate the project with `xcodegen generate`.
# The app name is defined here only (APP_NAME) and read at runtime through `AppInfo.name`.

name: Halo

options:
  bundleIdPrefix: io.github.nxritsu
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    APP_NAME: Halo
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Halo:
    type: application
    platform: macOS
    sources:
      - path: Halo
      # The licenses of Halo and of what it embeds must ship with the binaries.
      - path: LICENSE
        type: file
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        type: file
        buildPhase: resources
    dependencies:
      - package: Sparkle
      # Loaded by /usr/bin/perl at runtime, not linked by the app.
      - target: MediaRemoteHelper
        embed: true
        link: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nxritsu.Halo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Halo/Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Halo/Resources/Halo.entitlements
      properties:
        # Only used by the Music and Spotify fallback, when MediaRemote is unavailable.
        com.apple.security.automation.apple-events: true
    info:
      path: Halo/Resources/Info.plist
      properties:
        CFBundleName: $(APP_NAME)
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
        NSBluetoothAlwaysUsageDescription: "Halo detects when your AirPods or other Bluetooth audio devices connect, and shows their battery level. Nothing leaves your Mac."
        NSAppleEventsUsageDescription: "Halo controls playback in Music and Spotify when the system's now playing information is unavailable."
        NSAccessibilityUsageDescription: "Halo reads the position of menu bar items to avoid covering them. This is only used if you choose to show playback when there's room."
        # Each release attaches its own appcast, so this always points to the newest one.
        SUFeedURL: https://github.com/NxRitsu/Halo/releases/latest/download/appcast.xml
        # Public half of the key that signs updates. The private key is never in this repository.
        SUPublicEDKey: N4gWIydMzoVGjqdK0DokWrSnuY+MjoEic26uFGrYRms=

  MediaRemoteHelper:
    type: framework
    platform: macOS
    sources:
      - path: MediaRemoteHelper
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nxritsu.Halo.MediaRemoteHelper
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
        ENABLE_MODULE_VERIFIER: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: YES

schemes:
  Halo:
    build:
      targets:
        Halo: all
    run:
      config: Debug
    archive:
      config: Release
